name: Build and Deploy

on:
  workflow_dispatch:   # 添加手动触发按钮
  push:
    branches:
      - main   # 或者 master，取决于你的默认分支

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install and Build
        run: |
          cd simple-mind-map
          npm install
          cd ../web
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages